services:
  - type: web
    name: vennatta-core
    env: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: VENNATTA_RPC_URL
        value: https://mainnet.base.org
      - key: VENNATTA_NETWORK
        value: eip155:8453
      - key: VENNATTA_PLACEHOLDER_PRICE
        value: 0.01 USDC
    healthCheckPath: /health
    autoDeploy: true
