name: MCP bridge checks
on:
  push:
    branches: [feature/perplexity-mcp-bridge]
  pull_request:
    paths:
      - 'app/mcp_bridge.py'
      - 'requirements-mcp.txt'
      - 'tests/test_mcp*.py'
      - '.github/workflows/mcp-bridge.yml'
permissions:
  contents: read
jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-mcp.txt
      - run: python -m unittest discover -s tests -p 'test_mcp*.py' -v
      - run: python -m pip freeze
